services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: sera
      POSTGRES_USER: sera
      POSTGRES_PASSWORD: sera
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sera_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sera -d sera"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sera_postgres_data:
