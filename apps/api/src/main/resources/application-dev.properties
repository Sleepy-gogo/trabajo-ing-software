# The development Compose file lives at the repository root, two levels above apps/api.
spring.config.import=optional:file:.env[.properties]
spring.docker.compose.enabled=true
spring.docker.compose.file=../../compose.yml

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sera}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sera}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sera}

# Solo para cuentas de prueba; el gateway comprueba el vendedor antes de usarlo.
mercadopago.test-payer-email=${MP_TEST_PAYER_EMAIL:}
