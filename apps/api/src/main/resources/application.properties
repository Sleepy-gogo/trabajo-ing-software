spring.application.name=sera
spring.profiles.default=dev
spring.docker.compose.enabled=false
# Flyway crea el esquema; Hibernate valida el modelo JPA.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.port=4500
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Credenciales privadas de la API de Suscripciones de Mercado Pago.
mercadopago.access-token=${MP_ACCESS_TOKEN:}
mercadopago.webhook-secret=${MP_WEBHOOK_SECRET:}
mercadopago.back-url=${MP_BACK_URL:}
# Conexión PostgreSQL definida por el entorno.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
