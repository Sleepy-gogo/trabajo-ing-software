name: checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/api/pom.xml

      - name: Validate Docker Compose configuration
        working-directory: .
        run: docker compose config

      - name: Verify backend
        run: bash mvnw -B verify

      - name: Upload coverage and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: |
            apps/api/target/site/jacoco/
            apps/api/target/surefire-reports/
          retention-days: 30

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format-check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
